[project]
name = "attendance-tracker-ai-app"
version = "0.1.0"
description = "Self-hosted face-recognition attendance tracker."
readme = "CLAUDE.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18.5",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "cryptography>=49.0.0",
  "fastapi>=0.141.1",
  "greenlet>=3.5.4",
  "jinja2>=3.1.6",
  "numpy>=2.2",
  "onnxruntime>=1.28.0",
  "opencv-python>=5.0.0.93",
  "pillow>=12.3.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.14.2",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.32",
  "redis>=8.1.0",
  "scikit-image>=0.26.0",
  "sqlalchemy>=2.0.51",
  "uvicorn>=0.52.0",
  "weasyprint>=69.0",
  "websockets>=14.2",
  "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
  "mypy>=1.17",
  "httpx2>=2.9.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
