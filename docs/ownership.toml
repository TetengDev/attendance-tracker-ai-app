# docs/ownership.toml — maps issue keys to path globs for CI ownership checks

[[ownership]]
issue = "phase-0.5-contracts"
paths = [
  "backend/app/settings/**",
  "backend/app/face/**",
  "backend/app/api/**",
  "backend/app/attendance/**",
  "backend/app/db/**",
  "backend/app/scan/**",
  "backend/__init__.py",
  "backend/app/__init__.py",
  "backend/tests/**",
  "docs/**",
  "frontend/packages/protocol/**",
  "scripts/**",
  "Makefile*",
  ".python-version",
  "pyproject.toml",
  "uv.lock",
  ".github/**",
]

[[ownership]]
issue = "implement-face-protocol"
paths = ["backend/app/face/**"]

[[ownership]]
issue = "implement-settings-schema"
paths = ["backend/app/settings/**"]

[[ownership]]
issue = "implement-ws-schema"
